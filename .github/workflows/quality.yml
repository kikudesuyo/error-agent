name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: error_agent_test
          POSTGRES_USER: error_agent
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://error_agent:test-password@localhost:5432/error_agent_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Check formatting
        working-directory: api
        run: test -z "$(gofmt -l .)"
      - uses: ariga/setup-atlas@v0
      - name: Apply test migrations
        working-directory: api
        run: atlas migrate apply --dir "file://sql/migrations" --url "$TEST_DATABASE_URL"
      - name: Vet
        working-directory: api
        run: go vet ./...
      - name: Test
        working-directory: api
        run: go test ./...
      - name: Build
        working-directory: api
        run: go build ./...
      - name: Validate migrations
        working-directory: api
        run: atlas migrate validate --dir "file://sql/migrations"
